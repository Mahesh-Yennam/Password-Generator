<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Security Shield Outer -->
  <path d="M32 9 L49 16 C49 32 32 50 32 50 C32 50 15 32 15 16 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.18" />
  <path d="M32 9 L49 16 C49 32 32 50 32 50 C32 50 15 32 15 16 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Center Padlock -->
  <!-- Lock Shackle -->
  <path d="M26 27 V23 C26 19.68 28.68 17 32 17 C35.32 17 38 19.68 38 23 V27" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" />
  <!-- Lock Body -->
  <rect x="23" y="27" width="18" height="15" rx="3.5" fill="#10b981" />
  <!-- Keyhole -->
  <circle cx="32" cy="33" r="2" fill="#022c22" />
  <path d="M31.2 33.5 L30.8 38 H33.2 L32.8 33.5 Z" fill="#022c22" />
  
  <!-- Sparkle Accent -->
  <circle cx="45" cy="18" r="1.5" fill="#06b6d4" />
</svg>
